[pytest]
# Markers, and one deselection.
#
# `deployed` tests assert about https://www.faradaem.com as it is serving
# right now. The source tree is ahead of production by one deploy by
# definition, so running them by default would mean the suite goes red the
# moment a fix is written and green only after it ships -- exactly backwards.
# They are opt-in, and they are how you check a deploy actually landed:
#
#     pytest -m deployed
#
# Everything else, including the repository-reachability check that the
# install instructions depend on, runs in the default suite.
markers =
    deployed: checks the live faradaem.com deployment, not the source tree

addopts = -m "not deployed"
