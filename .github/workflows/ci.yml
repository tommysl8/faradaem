name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ngspice

      - name: Install pytest
        run: pip install pytest==9.1.1

      # The SKY130 PDK is not installed here, and the LLM keys are absent on
      # purpose: every test that needs either skips cleanly, which is itself
      # part of the design under test. What runs is the whole macromodel
      # suite against a real ngspice.
      - name: Run the suite
        env:
          FARADAEM_NGSPICE: /usr/bin/ngspice
        run: pytest -q

      # The host runs exactly this command, in a Linux container with no PDK
      # and no simulator in it. Proving it here means a deploy cannot fail on
      # something this repository already knew.
      - name: Build the published site the way the host will
        run: |
          python3 tools/build_static.py --out dist
          test -f dist/index.html
          test -f dist/catalogue.json
          test -f dist/static/stepplot.js
          python3 -c "import json; circuits = json.load(open('dist/catalogue.json'))['circuits']; assert len(circuits) >= 9, circuits"
